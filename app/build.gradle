plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.donnyyu.cleandash'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.donnyyu.cleandash'
        // Android 8.0. TS18 units ship Android 10, older head units Android 8/9.
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    // The release key lives outside the repo; its path and password come from ~/.gradle/gradle.properties.
    // Without them (CI, contributors) release builds fall back to the debug key.
    signingConfigs {
        if (project.hasProperty('cleandashStoreFile')) {
            release {
                storeFile file(cleandashStoreFile)
                storePassword cleandashStorePassword
                keyAlias cleandashKeyAlias
                keyPassword cleandashStorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Plain Java and platform Views only: no AndroidX, no Kotlin, no network.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

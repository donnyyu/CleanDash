# Builds CleanDash, runs the unit tests and lint on every push to main and every pull request.
# No secrets: the release APK here is signed with the runner's throwaway debug key, never a release key,
# so pull requests from forks can't reach anything sensitive.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A pull request could swap gradle-wrapper.jar for something else; this checks it is a real Gradle release.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Keep the APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleandash-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
